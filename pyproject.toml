[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hw2-fix-agent"
version = "1.0.0"
description = "修复 Agent：按审查发现改写代码，每一处改写都要过自检（软件工程实践 Homework 2）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "刘浩天", email = "934813156@qq.com" }]
keywords = ["agent", "workflow", "auto-fix", "ast", "se2026"]
# 主路径（规则级修补器）只用标准库；engine=llm 走 urllib，也不带第三方包
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fix-agent = "fix_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fix_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
